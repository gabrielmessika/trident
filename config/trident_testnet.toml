extends = "trident.toml"

# Profil de smoke-test live sur Hyperliquid testnet pour Pod A + Pod C.
# `--mode live --network testnet` place de vrais ordres sur le testnet,
# avec des endpoints, snapshots, rate limits et state files séparés du mainnet.

[hyperliquid]
ws_url = "wss://api.hyperliquid-testnet.xyz/ws"
info_url = "https://api.hyperliquid-testnet.xyz/info"
rate_limit_state_path = "./runtime/hyperliquid_testnet_rate_limits.json"
snapshot_output_dir = "./data/live_snapshots_testnet"
pod_b_feature_output_dir = "./data/live_features_testnet/pod_b"

# Univers volontairement réduit aux perps les plus probables du testnet.
# ETH reste crypto pour Pod A; BTC/SOL sont mappés sur des clusters Pod C
# afin de tester l'architecture A/C sans dépendre des marchés XYZ mainnet.
observation_universe = ["BTC", "ETH", "SOL"]
default_coins = ["BTC", "ETH", "SOL"]
# Le testnet HL est beaucoup moins liquide que le mainnet; ces seuils
# gardent le smoke A/C vivant sans toucher aux gates mainnet.
tradable_max_spread_bps = 25.0
tradable_min_bucket_notional_usd = 25.0
tradable_min_bucket_trade_count = 1

[hyperliquid.market_cluster_overrides]
BTC = "index"
SOL = "gold"

[hyperliquid.cluster_leaders]
crypto = ["ETH"]
index = ["BTC"]
gold = ["SOL"]

[trident.routing.symbol_pod_overrides]
ETH = "pod_a"
BTC = "pod_c"
SOL = "pod_c"

[pod_c]
max_spread_bps = 18.0
min_bucket_notional_usd = 25.0
min_bucket_trade_count = 1
min_activity_ratio = 0.35

[pod_c.cluster_modes.index]
allowed_setups = ["tradfi_continuation_long", "tradfi_continuation_short"]

[pod_c.cluster_modes.gold]
allowed_setups = ["tradfi_continuation_long", "tradfi_continuation_short"]
