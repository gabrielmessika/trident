[general]
mode = "observation"
host = "127.0.0.1"
port = 3000
log_level = "info"

[hyperliquid]
ws_url = "wss://api.hyperliquid.xyz/ws"
info_url = "https://api.hyperliquid.xyz/info"
rate_limit_state_path = "./runtime/hyperliquid_rate_limits.json"
snapshot_output_dir = "./data/live_snapshots"
bucket_ms = 60000
reconnect_delay_seconds = 5.0
max_reconnect_delay_seconds = 30.0
connect_timeout_seconds = 10.0
message_timeout_seconds = 20.0
heartbeat_interval_seconds = 25.0
max_idle_heartbeats = 2
info_requests_per_minute = 60
ws_connects_per_minute = 6
ws_messages_per_second = 8
shared_rate_limit_jitter_seconds = 0.1
circuit_breaker_threshold = 3
circuit_breaker_seconds = 30.0
# Lecons de gbot:
# - ~10 coins / connexion WS est la limite empirique stable
# - au-dela, il faut shard l'observation sur plusieurs connexions
# Le pool tradable du superviseur est derive de cet univers, puis filtre
# par qualite live (spread, activite, funding aberrant).
observation_universe = [
  "BTC", "ETH", "SOL", "HYPE",
  "DOGE", "XRP", "SUI",
  "AVAX", "LINK", "ARB",
  "ADA", "BNB", "LTC",
  "AAVE", "NEAR", "ZRO",
  "SPX", "PAXG",
]
max_coins_per_connection = 10
subscription_pacing_ms = 250
tradable_max_spread_bps = 10.0
tradable_min_bucket_notional_usd = 100.0
tradable_min_bucket_trade_count = 3
tradable_max_abs_funding_rate = 0.01
# Backward compat pour les anciennes commandes/tests.
default_coins = ["BTC", "ETH", "SOL", "HYPE"]

[hyperliquid.market_cluster_overrides]
SPX = "index"
PAXG = "gold"

[hyperliquid.cluster_leaders]
crypto = ["BTC", "ETH"]
index = ["SPX"]
gold = ["PAXG"]

[trident]
enabled = true

[trident.regime]
adx_trend_threshold = 22
trend_structure_threshold = 0.30
atr_ratio_panic_threshold = 1.8
dead_zone_atr_threshold = 0.45
dead_zone_range_threshold = 80
switch_confirmation_bars = 3
trend_confirmation_bars = 1
panic_confirmation_bars = 1

[trident.capital]
reference_equity_usd = 1000
max_allocation_per_symbol_pct = 0.25
min_symbol_allocation_usd = 25

[trident.risk]
min_confidence = 0.50
max_trade_plans_per_batch = 2
min_trade_notional_usd = 10
max_risk_per_trade_pct = 0.015
max_total_open_risk_pct = 0.03

[trident.execution]
dry_run_taker_fee_bps = 3.5
dry_run_slippage_bps = 0.5
dry_run_spread_multiplier = 0.5
routing_revoke_grace_minutes = 60

[trident.execution.routing_revoke_grace_minutes_by_symbol]
DOGE = 180
LINK = 180
ARB = 180
AVAX = 180
SUI = 180
XRP = 180
SOL = 150
HYPE = 150
BTC = 60
ETH = 60

[trident.routing]
min_assign_score = 0.40
min_hold_score = 0.30
hysteresis_margin = 0.10
reassignment_cooldown_seconds = 600
reassignment_debounce_min_score = 0.12
runtime_override_path = "./runtime/trident/symbol_routing_overrides.json"

[trident.routing.reassignment_debounce_seconds_by_symbol]
DOGE = 10800
LINK = 10800
ARB = 10800
AVAX = 9000
SUI = 10800
XRP = 9000
SOL = 7200
HYPE = 7200

[trident.routing.symbol_pod_overrides]
# BTC = "pod_a"
# ETH = "pod_b"

[trident.allocations.trend_expansion]
pod_a = 0.85
pod_b = 0.15
pod_c = 0.00
cash = 0.00

[trident.allocations.range_auction]
pod_a = 0.10
pod_b = 0.90
pod_c = 0.00
cash = 0.00

[trident.allocations.panic_squeeze]
pod_a = 0.15
pod_b = 0.00
pod_c = 0.00
cash = 0.85

[trident.allocations.dead_zone]
pod_a = 0.00
pod_b = 0.25
pod_c = 0.00
cash = 0.75

[pod_a]
enabled = true
symbols = ["BTC", "ETH", "SOL", "HYPE"]
max_allocation_pct = 0.85
default_leverage = 2.0
max_leverage = 5.0
prefer_isolated = true
sizing_mode = "risk_based"
risk_per_trade_pct = 0.0125
min_margin_usd = 20
min_notional_usd = 10
allow_partial_take_profit = false
allow_break_even = true
disabled_setups = ["bos_retest_short", "bos_retest_long", "trend_pullback_short"]
blocked_regimes = ["DeadZone", "RangeAuction"]
allowed_setups_in_blocked_regimes = ["liquidity_sweep_reclaim_long"]

[pod_a.max_leverage_by_symbol]
BTC = 40
ETH = 25
SOL = 20
HYPE = 10
DOGE = 10
XRP = 20
SUI = 10
AVAX = 10
LINK = 10
ARB = 10

[pod_b]
enabled = true
symbols = ["DOGE", "XRP", "SUI"]
passivbot_config_path = "./runtime/passivbot/live.json"
launch_command = []
launch_workdir = ""
max_allocation_pct = 0.40
paper_quote_width_bps = 10.0
paper_order_size_pct = 0.18
paper_max_inventory_skew_pct = 0.40
paper_maker_fee_bps = 0.0
paper_recent_fills_limit = 20
paper_pause_outside_range = true
paper_guard_max_adx = 20.0
paper_guard_max_atr_ratio = 0.9
paper_guard_max_abs_structure_score = 0.2
paper_guard_max_range_width_bps = 90.0
paper_flow_toxicity_threshold = 0.15
paper_one_sided_inventory_threshold_pct = 0.30
paper_quote_width_bucket_multiplier = 0.45
paper_quote_width_toxicity_multiplier = 2.0
paper_order_size_toxicity_discount = 0.6

[pod_b.paper_quote_width_multiplier_by_symbol]
BTC = 1.25
HYPE = 1.50
XRP = 1.35

[pod_b.paper_order_size_multiplier_by_symbol]
BTC = 0.70
HYPE = 0.50
XRP = 0.60

[pod_b.paper_max_inventory_skew_pct_by_symbol]
BTC = 0.75
HYPE = 0.60
XRP = 0.65

[pod_c]
enabled = false
max_allocation_pct = 0.90
max_spread_bps = 6.0
min_confidence = 0.62
size_multiplier = 0.55
reentry_cooldown_minutes = 90
time_stop_hours = 3
blocked_symbols = []
# Squeeze Breakout v2 parameters
squeeze_lookback = 20           # rolling window size (snapshots, ~1 per minute)
squeeze_threshold = 0.50        # current_vol / avg_vol below this = squeeze detected
breakout_multiplier = 1.8       # current_vol / avg_vol above this = breakout trigger
min_flow_alignment = 0.55       # min directional flow score to confirm breakout direction
min_volume_spike = 1.5          # min trade_count / avg_trade_count for volume confirmation
