[hyperliquid]
info_url = "https://api.hyperliquid.xyz/info"
ws_url = "wss://api.hyperliquid.xyz/ws"

[hip4_outcome]
mode = "paper" # observer | paper | testnet
allow_testnet_orders = false
require_testnet_url = false

logs_dir = "./logs/hip4_outcome_mainnet_paper"
state_path = "./runtime/hip4_outcome_mainnet_paper_state.json"
status_path = "./logs/hip4_outcome_status.json"
write_pod_b_alias_status = true
pod_b_alias_status_path = "./logs/pod_b_live_status.json"
rate_limit_state_path = "./runtime/hip4_outcome_mainnet_paper_rate_limits.json"

loop_interval_seconds = 4
request_timeout_seconds = 10
info_requests_per_minute = 240

# Mainnet paper is the Pod B dry-run source of truth. Empty list means accept
# every tradable priceBinary returned by mainnet outcomeMeta; named outcomes are
# promoted only by the conservative paper basket engine below.
include_underlyings = []
reference_price_sources = ["binance", "okx", "bybit", "coinbase", "kraken", "hyperliquid"]
anchor_reference_to_hyperliquid = true
max_source_deviation_bps = 50
min_reference_sources = 1
external_price_timeout_seconds = 5
external_price_user_agent = "trident-hip4-outcome-mainnet-paper/0.1"
max_markets_per_loop = 12
max_opportunities_per_loop = 4
min_time_to_expiry_seconds = 20
max_time_to_expiry_minutes = 10080

enable_late_expiry = true
enable_parity = true
enable_model = true
enable_short_expiry = true
# Keep short-expiry as observation only for the next 48h. The latest proxy
# backtests were NOGO, so this path logs features/watchlist but does not open
# SHORT_EXPIRY opportunities.
short_expiry_observe_only = true
enable_price_bucket = true
enable_named_outcome_basket = true
named_outcome_basket_min_count = 2
enable_market_observation = true
observe_unsupported_books = true
max_observation_markets_per_loop = 80
max_observation_books_per_loop = 30
enable_embedded_observers = false
embedded_observer_config_paths = []

# Global adverse-momentum guard: do not approve BUY_YES into a sharp/downward
# shock, or BUY_NO into a sharp/upward shock. It applies to every priceBinary
# underlying Pod B sees, not to a hard-coded coin/side. The dry-run backtest
# kept the guard but made it less nervous: require two adverse windows before
# rejecting, instead of one isolated short-window print.
blocked_opportunity_slices = []
enable_shock_guard = true
shock_guard_windows_seconds = [900, 3600, 14400, 86400, 259200, 604800]
shock_guard_adverse_move_bps = [80, 150, 250, 300, 300, 400]
shock_guard_history_seconds = 604800
shock_guard_sample_interval_seconds = 900
shock_guard_price_history_limit = 1200
shock_guard_min_adverse_windows = 2
shock_guard_edge_types = ["MODEL", "LATE_EXPIRY", "SHORT_EXPIRY"]
late_expiry_window_minutes = 20
strike_buffer_bps = 8
max_late_yes_price = 0.97
max_late_no_price = 0.97

short_expiry_window_minutes = 6
short_expiry_periods = ["5m", "15m", "1d"]
short_expiry_history_seconds = 900
short_expiry_min_history_seconds = 45
short_expiry_price_history_limit = 720
short_expiry_momentum_windows_seconds = [30, 60, 180]
short_expiry_primary_momentum_seconds = 60
short_expiry_min_abs_momentum_bps = 1.0
short_expiry_momentum_scale_bps = 12
short_expiry_distance_scale_bps = 30
short_expiry_distance_weight = 0.22
short_expiry_momentum_weight = 0.22
short_expiry_microstructure_weight = 0.16
short_expiry_book_imbalance_weight = 0.08
short_expiry_static_model_weight = 0.32
short_expiry_min_confidence = 0.55
short_expiry_max_yes_price = 0.92
short_expiry_max_no_price = 0.92
short_expiry_require_momentum_alignment = true
short_expiry_watchlist_limit = 8
price_bucket_max_yes_price = 0.98
price_bucket_max_no_price = 0.98

# HIP-4 outcome docs: opening positions is fee-free; fees apply when closing/settling.
# Keep the fee/slippage/min-order assumptions learned during testnet integration.
outcome_open_fee_rate = 0.0
outcome_settlement_fee_rate = 0.002
estimated_fees = 0.002
estimated_slippage = 0.005
safety_margin = 0.01
min_gross_edge = 0.025
min_net_edge = 0.015

# Paper-only position management: simulate selling held YES/NO inventory at the
# visible bid before expiry when the book already pays enough or the edge fades.
enable_early_exit = true
early_exit_probability_haircut = 0.03
early_exit_min_ev_premium = 0.02
early_exit_min_ev_exit_roi = 0.05
early_exit_take_profit_roi = 0.35
early_exit_take_profit_fraction = 0.5
early_exit_full_take_profit_roi = 0.80
# Defensive stop promoted to dry-run paper after replay. The PnL-first 48h
# setting keeps the old probability trigger and caps accepted realized loss.
enable_early_exit_probability_stop = true
early_exit_stop_probability = 0.35
early_exit_stop_max_loss_roi = 0.20
early_exit_free_short_window_seconds = 420
early_exit_free_short_window_min_roi = 0.0
early_exit_reentry_cooldown_seconds = 600

# Paper-only parallel experiments. These write shadow CSV/state metadata but do
# not change the active paper position sizing or execution policy.
enable_shadow_exit_policies = true
shadow_exit_take_profit_rois = [0.25, 0.35, 0.50]
shadow_exit_short_window_seconds = [300, 600, 900]
shadow_exit_partial_fraction = 0.5
enable_shadow_sizing = true
shadow_sizing_bankroll_usdc = 500
shadow_sizing_kelly_fraction_cap = 0.25
shadow_sizing_probability_haircut = 0.03
enable_shadow_maker_quotes = true
shadow_maker_price_improvement = 0.01
shadow_maker_min_net_edge = 0.01

default_annualized_vol = 0.85
max_position_usdc = 50
pod_b_budget_usdc = 500
max_total_outcome_exposure_usdc = 500
max_per_underlying_outcome_exposure_usdc = 150
max_outcome_markets_open = 3

min_yes_depth_usdc = 12
min_no_depth_usdc = 12
max_spread = 0.60
max_order_slippage = 0.03
min_order_value_usdc = 10
outcome_size_decimals = 0
order_tif = "Ioc"
enforce_testnet_balance_check = false
testnet_balance_coin = "USDH"
testnet_balance_buffer_usdc = 1
auto_transfer_testnet_spot_usdc = false
testnet_spot_transfer_target_usdc = 0
settlement_grace_seconds = 300
fills_lookback_hours = 24
reconcile_after_execution = false
reconcile_every_loops = 0
enable_latency_log = true
enable_edge_decay_log = true
enable_daily_summary = true
edge_decay_state_limit = 2000

[hip4_outcome.annualized_vol_by_underlying]
BTC = 0.65
ETH = 0.75
SOL = 0.95
HYPE = 1.25
DOGE = 1.20
XRP = 1.05
SUI = 1.20
AVAX = 1.05
LINK = 1.00
ARB = 1.20
ADA = 1.05
BNB = 0.75
LTC = 0.85
AAVE = 1.05
NEAR = 1.15
ZRO = 1.35
