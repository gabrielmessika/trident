services:
  trident-api:
    build:
      context: .
      dockerfile: Dockerfile.trident
    container_name: trident-api
    environment:
      TRIDENT_ENABLE_POD_A: ${TRIDENT_ENABLE_POD_A:-true}
      TRIDENT_ENABLE_POD_B: ${TRIDENT_ENABLE_POD_B:-}
      TRIDENT_ENABLE_POD_C: ${TRIDENT_ENABLE_POD_C:-}
    command:
      - python
      - -m
      - app.main
      - --mode
      - observation
      - --profile
      - trident-docker
      - --host
      - 0.0.0.0
      - --port
      - "3000"
    ports:
      - "3000:3000"
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./data:/app/data
      - ./runtime:/app/runtime
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  pod-a-live:
    build:
      context: .
      dockerfile: Dockerfile.trident
    container_name: trident-pod-a-live
    environment:
      TRIDENT_ENABLE_POD_A: ${TRIDENT_ENABLE_POD_A:-true}
      TRIDENT_ENABLE_POD_B: ${TRIDENT_ENABLE_POD_B:-}
      TRIDENT_ENABLE_POD_C: ${TRIDENT_ENABLE_POD_C:-}
    command:
      - python
      - -m
      - app.live.pod_a_live_runner
      - --config
      - config/trident.toml
      - --journal-output
      - logs/pod_a_live.jsonl
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      trident-api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  pod-b-live:
    build:
      context: .
      dockerfile: Dockerfile.trident
    container_name: trident-pod-b-live
    environment:
      TRIDENT_ENABLE_POD_A: ${TRIDENT_ENABLE_POD_A:-true}
      TRIDENT_ENABLE_POD_B: ${TRIDENT_ENABLE_POD_B:-}
      TRIDENT_ENABLE_POD_C: ${TRIDENT_ENABLE_POD_C:-}
    command:
      - python
      - -m
      - app.trident.pod_b.paper_live_runner
      - --config-path
      - runtime/passivbot/live.json
      - --input
      - data/live_snapshots
      - --journal-output
      - logs/pod_b_live.jsonl
      - --report-output
      - logs/pod_b_live_report.json
      - --poll-seconds
      - "1.0"
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./data:/app/data
      - ./runtime:/app/runtime
    depends_on:
      trident-api:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["pod_b"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  pod-c-live:
    build:
      context: .
      dockerfile: Dockerfile.trident
    container_name: trident-pod-c-live
    environment:
      TRIDENT_ENABLE_POD_A: ${TRIDENT_ENABLE_POD_A:-true}
      TRIDENT_ENABLE_POD_B: ${TRIDENT_ENABLE_POD_B:-}
      TRIDENT_ENABLE_POD_C: ${TRIDENT_ENABLE_POD_C:-}
    command:
      - python
      - -m
      - app.live.pod_c_live_runner
      - --config
      - config/trident.toml
      - --journal-output
      - logs/pod_c_live.jsonl
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./data:/app/data
    depends_on:
      trident-api:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["pod_c"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  funding-collector:
    build:
      context: .
      dockerfile: Dockerfile.trident
    container_name: trident-funding-collector
    command:
      - python
      - -m
      - app.live.funding_collector
      - --config
      - config/trident.toml
      - --output
      - data/funding_history/current.jsonl
      - --poll-seconds
      - "300"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./runtime:/app/runtime
      - ./logs:/app/logs
    restart: unless-stopped
    profiles: ["funding"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
