services:
  trident-api:
    build:
      context: .
      dockerfile: Dockerfile.trident
    container_name: trident-api
    environment:
      TRIDENT_ENABLE_POD_A: ${TRIDENT_ENABLE_POD_A:-true}
      TRIDENT_ENABLE_POD_B: "false"
      TRIDENT_ENABLE_POD_C: ${TRIDENT_ENABLE_POD_C:-}
      TRIDENT_APP_KIND: trident
      TRIDENT_MODE: ${TRIDENT_MODE:-dry-run}
      TRIDENT_EXCHANGE_NETWORK: ${TRIDENT_EXCHANGE_NETWORK:-mainnet}
      TRIDENT_CONFIG_PATH: ${TRIDENT_CONFIG_PATH:-config/trident.toml}
      TRIDENT_ACCOUNT_ADDRESS: ${TRIDENT_ACCOUNT_ADDRESS:-}
      TRIDENT_SECRET_KEY: ${TRIDENT_SECRET_KEY:-}
      TRIDENT_VAULT_ADDRESS: ${TRIDENT_VAULT_ADDRESS:-}
      TRIDENT_LIVE_CONFIRM: ${TRIDENT_LIVE_CONFIRM:-}
      TRIDENT_LIVE_STATE_PATH: ${TRIDENT_LIVE_STATE_PATH:-}
      TRIDENT_LIVE_STATE_PATH_POD_A: ${TRIDENT_LIVE_STATE_PATH_POD_A:-}
      TRIDENT_LIVE_STATE_PATH_POD_C: ${TRIDENT_LIVE_STATE_PATH_POD_C:-}
      TRIDENT_LIVE_ALLOW_UNKNOWN_POSITIONS: ${TRIDENT_LIVE_ALLOW_UNKNOWN_POSITIONS:-}
      TRIDENT_LIVE_ALLOW_OPEN_ORDERS: ${TRIDENT_LIVE_ALLOW_OPEN_ORDERS:-}
      TRIDENT_LIVE_SKIP_USER_WS_CHECK: ${TRIDENT_LIVE_SKIP_USER_WS_CHECK:-}
      TRIDENT_CRASH_ALERT_EMAIL_TO: ${TRIDENT_CRASH_ALERT_EMAIL_TO:-}
      TRIDENT_CRASH_ALERT_EMAIL_FROM: ${TRIDENT_CRASH_ALERT_EMAIL_FROM:-}
      TRIDENT_CRASH_ALERT_SMTP_HOST: ${TRIDENT_CRASH_ALERT_SMTP_HOST:-}
      TRIDENT_CRASH_ALERT_SMTP_PORT: ${TRIDENT_CRASH_ALERT_SMTP_PORT:-}
      TRIDENT_CRASH_ALERT_SMTP_TLS: ${TRIDENT_CRASH_ALERT_SMTP_TLS:-}
      TRIDENT_CRASH_ALERT_SMTP_USER: ${TRIDENT_CRASH_ALERT_SMTP_USER:-}
      TRIDENT_CRASH_ALERT_SMTP_PASSWORD: ${TRIDENT_CRASH_ALERT_SMTP_PASSWORD:-}
      TRIDENT_CRASH_ALERT_SENDMAIL_PATH: ${TRIDENT_CRASH_ALERT_SENDMAIL_PATH:-}
      TRIDENT_CRASH_ALERT_COOLDOWN_SECONDS: ${TRIDENT_CRASH_ALERT_COOLDOWN_SECONDS:-}
      TRIDENT_CRASH_ALERT_STATE_PATH: ${TRIDENT_CRASH_ALERT_STATE_PATH:-}
      TRIDENT_ENABLE_HIP4_OUTCOME: "false"
      TRIDENT_ENABLE_FUNDING: ${TRIDENT_ENABLE_FUNDING:-true}
      TRIDENT_UI_AUTH_USERNAME: ${TRIDENT_UI_AUTH_USERNAME:-}
      TRIDENT_UI_AUTH_PASSWORD: ${TRIDENT_UI_AUTH_PASSWORD:-}
      TRIDENT_ROUTING_OVERRIDE_ENABLED: ${TRIDENT_ROUTING_OVERRIDE_ENABLED:-false}
    command:
      - python
      - -m
      - app.main
      - --mode
      - ${TRIDENT_MODE:-dry-run}
      - --profile
      - trident-docker
      - --config
      - ${TRIDENT_CONFIG_PATH:-config/trident.toml}
      - --host
      - 0.0.0.0
      - --port
      - "3000"
    ports:
      - "${TRIDENT_API_BIND:-127.0.0.1}:3000:3000"
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./data:/app/data
      - ./runtime:/app/runtime
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  pod-a-live:
    build:
      context: .
      dockerfile: Dockerfile.trident
    container_name: trident-pod-a-live
    environment:
      TRIDENT_ENABLE_POD_A: ${TRIDENT_ENABLE_POD_A:-true}
      TRIDENT_ENABLE_POD_B: "false"
      TRIDENT_ENABLE_POD_C: ${TRIDENT_ENABLE_POD_C:-}
      TRIDENT_MODE: ${TRIDENT_MODE:-dry-run}
      TRIDENT_EXCHANGE_NETWORK: ${TRIDENT_EXCHANGE_NETWORK:-mainnet}
      TRIDENT_CONFIG_PATH: ${TRIDENT_CONFIG_PATH:-config/trident.toml}
      TRIDENT_ACCOUNT_ADDRESS: ${TRIDENT_ACCOUNT_ADDRESS:-}
      TRIDENT_SECRET_KEY: ${TRIDENT_SECRET_KEY:-}
      TRIDENT_VAULT_ADDRESS: ${TRIDENT_VAULT_ADDRESS:-}
      TRIDENT_LIVE_CONFIRM: ${TRIDENT_LIVE_CONFIRM:-}
      TRIDENT_LIVE_STATE_PATH: ${TRIDENT_LIVE_STATE_PATH:-}
      TRIDENT_LIVE_STATE_PATH_POD_A: ${TRIDENT_LIVE_STATE_PATH_POD_A:-}
      TRIDENT_LIVE_STATE_PATH_POD_C: ${TRIDENT_LIVE_STATE_PATH_POD_C:-}
      TRIDENT_LIVE_ALLOW_UNKNOWN_POSITIONS: ${TRIDENT_LIVE_ALLOW_UNKNOWN_POSITIONS:-}
      TRIDENT_LIVE_ALLOW_OPEN_ORDERS: ${TRIDENT_LIVE_ALLOW_OPEN_ORDERS:-}
      TRIDENT_LIVE_SKIP_USER_WS_CHECK: ${TRIDENT_LIVE_SKIP_USER_WS_CHECK:-}
      TRIDENT_CRASH_ALERT_EMAIL_TO: ${TRIDENT_CRASH_ALERT_EMAIL_TO:-}
      TRIDENT_CRASH_ALERT_EMAIL_FROM: ${TRIDENT_CRASH_ALERT_EMAIL_FROM:-}
      TRIDENT_CRASH_ALERT_SMTP_HOST: ${TRIDENT_CRASH_ALERT_SMTP_HOST:-}
      TRIDENT_CRASH_ALERT_SMTP_PORT: ${TRIDENT_CRASH_ALERT_SMTP_PORT:-}
      TRIDENT_CRASH_ALERT_SMTP_TLS: ${TRIDENT_CRASH_ALERT_SMTP_TLS:-}
      TRIDENT_CRASH_ALERT_SMTP_USER: ${TRIDENT_CRASH_ALERT_SMTP_USER:-}
      TRIDENT_CRASH_ALERT_SMTP_PASSWORD: ${TRIDENT_CRASH_ALERT_SMTP_PASSWORD:-}
      TRIDENT_CRASH_ALERT_SENDMAIL_PATH: ${TRIDENT_CRASH_ALERT_SENDMAIL_PATH:-}
      TRIDENT_CRASH_ALERT_COOLDOWN_SECONDS: ${TRIDENT_CRASH_ALERT_COOLDOWN_SECONDS:-}
      TRIDENT_CRASH_ALERT_STATE_PATH: ${TRIDENT_CRASH_ALERT_STATE_PATH:-}
      TRIDENT_ENABLE_HIP4_OUTCOME: "false"
    command:
      - python
      - -m
      - app.live.pod_a_live_runner
      - --mode
      - ${TRIDENT_MODE:-dry-run}
      - --config
      - ${TRIDENT_CONFIG_PATH:-config/trident.toml}
      - --journal-output
      - logs/pod_a_live.jsonl
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./data:/app/data
      - ./runtime:/app/runtime
    depends_on:
      trident-api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

