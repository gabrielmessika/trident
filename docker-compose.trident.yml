      context: .
      dockerfile: Dockerfile.trident
    container_name: trident-tradfi-funding-collector
    command:
      - python
      - -m
      - app.live.tradfi_funding_collector
      - --config
      - ${TRIDENT_CONFIG_PATH:-config/trident.toml}
