services:
  trident-api:
    build:
      context: .
      dockerfile: Dockerfile.trident
    container_name: trident-api
    environment:
      TRIDENT_ENABLE_POD_A: ${TRIDENT_ENABLE_POD_A:-true}
      TRIDENT_ENABLE_POD_B: ${TRIDENT_ENABLE_POD_B:-}
      TRIDENT_ENABLE_POD_C: ${TRIDENT_ENABLE_POD_C:-}
      TRIDENT_MODE: ${TRIDENT_MODE:-dry-run}
      TRIDENT_CONFIG_PATH: ${TRIDENT_CONFIG_PATH:-config/trident.toml}
      TRIDENT_ACCOUNT_ADDRESS: ${TRIDENT_ACCOUNT_ADDRESS:-}
      TRIDENT_SECRET_KEY: ${TRIDENT_SECRET_KEY:-}
      TRIDENT_VAULT_ADDRESS: ${TRIDENT_VAULT_ADDRESS:-}
      TRIDENT_LIVE_CONFIRM: ${TRIDENT_LIVE_CONFIRM:-}
      TRIDENT_LIVE_STATE_PATH: ${TRIDENT_LIVE_STATE_PATH:-}
      TRIDENT_LIVE_STATE_PATH_POD_A: ${TRIDENT_LIVE_STATE_PATH_POD_A:-}
      TRIDENT_LIVE_STATE_PATH_POD_C: ${TRIDENT_LIVE_STATE_PATH_POD_C:-}
      TRIDENT_LIVE_ALLOW_UNKNOWN_POSITIONS: ${TRIDENT_LIVE_ALLOW_UNKNOWN_POSITIONS:-}
      TRIDENT_LIVE_ALLOW_OPEN_ORDERS: ${TRIDENT_LIVE_ALLOW_OPEN_ORDERS:-}
      TRIDENT_LIVE_SKIP_USER_WS_CHECK: ${TRIDENT_LIVE_SKIP_USER_WS_CHECK:-}
      TRIDENT_ENABLE_HIP4_OUTCOME: ${TRIDENT_ENABLE_HIP4_OUTCOME:-true}
      TRIDENT_TRIGGER_LIQUIDITY_SQL_API_KEY: ${TRIDENT_TRIGGER_LIQUIDITY_SQL_API_KEY:-}
    command:
      - python
      - -m
      - app.main
      - --mode
      - ${TRIDENT_MODE:-dry-run}
      - --profile
      - trident-docker
      - --config
      - ${TRIDENT_CONFIG_PATH:-config/trident.toml}
      - --host
      - 0.0.0.0
      - --port
      - "3000"
    ports:
      - "3000:3000"
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./data:/app/data
      - ./runtime:/app/runtime
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  pod-a-live:
    build:
      context: .
      dockerfile: Dockerfile.trident
    container_name: trident-pod-a-live
    environment:
      TRIDENT_ENABLE_POD_A: ${TRIDENT_ENABLE_POD_A:-true}
      TRIDENT_ENABLE_POD_B: ${TRIDENT_ENABLE_POD_B:-}
      TRIDENT_ENABLE_POD_C: ${TRIDENT_ENABLE_POD_C:-}
      TRIDENT_MODE: ${TRIDENT_MODE:-dry-run}
      TRIDENT_CONFIG_PATH: ${TRIDENT_CONFIG_PATH:-config/trident.toml}
      TRIDENT_ACCOUNT_ADDRESS: ${TRIDENT_ACCOUNT_ADDRESS:-}
      TRIDENT_SECRET_KEY: ${TRIDENT_SECRET_KEY:-}
      TRIDENT_VAULT_ADDRESS: ${TRIDENT_VAULT_ADDRESS:-}
      TRIDENT_LIVE_CONFIRM: ${TRIDENT_LIVE_CONFIRM:-}
      TRIDENT_LIVE_STATE_PATH: ${TRIDENT_LIVE_STATE_PATH:-}
      TRIDENT_LIVE_STATE_PATH_POD_A: ${TRIDENT_LIVE_STATE_PATH_POD_A:-}
      TRIDENT_LIVE_STATE_PATH_POD_C: ${TRIDENT_LIVE_STATE_PATH_POD_C:-}
      TRIDENT_LIVE_ALLOW_UNKNOWN_POSITIONS: ${TRIDENT_LIVE_ALLOW_UNKNOWN_POSITIONS:-}
      TRIDENT_LIVE_ALLOW_OPEN_ORDERS: ${TRIDENT_LIVE_ALLOW_OPEN_ORDERS:-}
      TRIDENT_LIVE_SKIP_USER_WS_CHECK: ${TRIDENT_LIVE_SKIP_USER_WS_CHECK:-}
      TRIDENT_ENABLE_HIP4_OUTCOME: ${TRIDENT_ENABLE_HIP4_OUTCOME:-true}
    command:
      - python
      - -m
      - app.live.pod_a_live_runner
      - --mode
      - ${TRIDENT_MODE:-dry-run}
      - --config
      - ${TRIDENT_CONFIG_PATH:-config/trident.toml}
      - --journal-output
      - logs/pod_a_live.jsonl
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./data:/app/data
      - ./runtime:/app/runtime
    depends_on:
      trident-api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  trigger-liquidity-enricher:
    build:
      context: .
      dockerfile: Dockerfile.trident
    container_name: trident-trigger-liquidity-enricher
    command:
      - python
      - -m
      - app.live.trigger_liquidity_enricher
      - --config
      - ${TRIDENT_CONFIG_PATH:-config/trident.toml}
      - --watch
      - --poll-seconds
      - "60"
      - --status-output
      - runtime/trigger_liquidity_enricher_status.json
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./data:/app/data
      - ./runtime:/app/runtime
    depends_on:
      trident-api:
        condition: service_healthy
      trigger-liquidity-collector:
        condition: service_started
    restart: unless-stopped
    profiles: ["trigger_liquidity"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  trigger-liquidity-collector:
    build:
      context: .
      dockerfile: Dockerfile.trident
    container_name: trident-trigger-liquidity-collector
    environment:
      TRIDENT_TRIGGER_LIQUIDITY_QUICKNODE_URL: ${TRIDENT_TRIGGER_LIQUIDITY_QUICKNODE_URL:-}
      TRIDENT_TRIGGER_LIQUIDITY_QUICKNODE_STREAM: ${TRIDENT_TRIGGER_LIQUIDITY_QUICKNODE_STREAM:-orders}
      TRIDENT_TRIGGER_LIQUIDITY_QUICKNODE_BATCH_SIZE: ${TRIDENT_TRIGGER_LIQUIDITY_QUICKNODE_BATCH_SIZE:-200}
      TRIDENT_TRIGGER_LIQUIDITY_QUICKNODE_INITIAL_LOOKBACK_BLOCKS: ${TRIDENT_TRIGGER_LIQUIDITY_QUICKNODE_INITIAL_LOOKBACK_BLOCKS:-2000}
      TRIDENT_TRIGGER_LIQUIDITY_QUICKNODE_MAX_BLOCKS_PER_POLL: ${TRIDENT_TRIGGER_LIQUIDITY_QUICKNODE_MAX_BLOCKS_PER_POLL:-1000}
      TRIDENT_TRIGGER_LIQUIDITY_QUICKNODE_TIMEOUT_SECONDS: ${TRIDENT_TRIGGER_LIQUIDITY_QUICKNODE_TIMEOUT_SECONDS:-10}
    command:
      - python
      - -m
      - app.live.trigger_liquidity_collector
      - --node-source
      - /hl-node/node_order_statuses/hourly
      - --node-source
      - data/node_order_statuses/hourly
      - --output-dir
      - data/trigger_liquidity
      - --state-path
      - runtime/trigger_liquidity_collector_state.json
      - --status-output
      - runtime/trigger_liquidity_collector_status.json
      - --lookback-hours
      - "6"
      - --poll-seconds
      - ${TRIDENT_TRIGGER_LIQUIDITY_POLL_SECONDS:-30}
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./data:/app/data
      - ./runtime:/app/runtime
      - ${TRIDENT_HL_NODE_ORDER_STATUSES_DIR:-./data/node_order_statuses/hourly}:/hl-node/node_order_statuses/hourly:ro
    restart: unless-stopped
    profiles: ["trigger_liquidity"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  pod-b-live:
    build:
      context: .
      dockerfile: Dockerfile.trident
    container_name: trident-pod-b-live
    environment:
      TRIDENT_ENABLE_POD_A: ${TRIDENT_ENABLE_POD_A:-true}
      TRIDENT_ENABLE_POD_B: ${TRIDENT_ENABLE_POD_B:-}
      TRIDENT_ENABLE_POD_C: ${TRIDENT_ENABLE_POD_C:-}
      TRIDENT_MODE: ${TRIDENT_MODE:-dry-run}
      TRIDENT_CONFIG_PATH: ${TRIDENT_CONFIG_PATH:-config/trident.toml}
      TRIDENT_ACCOUNT_ADDRESS: ${TRIDENT_ACCOUNT_ADDRESS:-}
      TRIDENT_SECRET_KEY: ${TRIDENT_SECRET_KEY:-}
      TRIDENT_VAULT_ADDRESS: ${TRIDENT_VAULT_ADDRESS:-}
      TRIDENT_LIVE_CONFIRM: ${TRIDENT_LIVE_CONFIRM:-}
      TRIDENT_LIVE_STATE_PATH: ${TRIDENT_LIVE_STATE_PATH:-}
      TRIDENT_LIVE_STATE_PATH_POD_A: ${TRIDENT_LIVE_STATE_PATH_POD_A:-}
      TRIDENT_LIVE_STATE_PATH_POD_C: ${TRIDENT_LIVE_STATE_PATH_POD_C:-}
      TRIDENT_LIVE_ALLOW_UNKNOWN_POSITIONS: ${TRIDENT_LIVE_ALLOW_UNKNOWN_POSITIONS:-}
      TRIDENT_LIVE_ALLOW_OPEN_ORDERS: ${TRIDENT_LIVE_ALLOW_OPEN_ORDERS:-}
      TRIDENT_LIVE_SKIP_USER_WS_CHECK: ${TRIDENT_LIVE_SKIP_USER_WS_CHECK:-}
      TRIDENT_ENABLE_HIP4_OUTCOME: ${TRIDENT_ENABLE_HIP4_OUTCOME:-true}
    command:
      - python
      - -m
      - app.live.pod_b_live_runner
      - --mode
      - ${TRIDENT_MODE:-dry-run}
      - --config
      - ${TRIDENT_CONFIG_PATH:-config/trident.toml}
      - --journal-output
      - logs/pod_b_live.jsonl
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./data:/app/data
      - ./runtime:/app/runtime
    depends_on:
      trident-api:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["legacy_pod_b"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  pod-c-live:
    build:
      context: .
      dockerfile: Dockerfile.trident
    container_name: trident-pod-c-live
    environment:
      TRIDENT_ENABLE_POD_A: ${TRIDENT_ENABLE_POD_A:-true}
      TRIDENT_ENABLE_POD_B: ${TRIDENT_ENABLE_POD_B:-}
      TRIDENT_ENABLE_POD_C: ${TRIDENT_ENABLE_POD_C:-}
      TRIDENT_MODE: ${TRIDENT_MODE:-dry-run}
      TRIDENT_CONFIG_PATH: ${TRIDENT_CONFIG_PATH:-config/trident.toml}
      TRIDENT_ACCOUNT_ADDRESS: ${TRIDENT_ACCOUNT_ADDRESS:-}
      TRIDENT_SECRET_KEY: ${TRIDENT_SECRET_KEY:-}
      TRIDENT_VAULT_ADDRESS: ${TRIDENT_VAULT_ADDRESS:-}
      TRIDENT_LIVE_CONFIRM: ${TRIDENT_LIVE_CONFIRM:-}
      TRIDENT_LIVE_STATE_PATH: ${TRIDENT_LIVE_STATE_PATH:-}
      TRIDENT_LIVE_STATE_PATH_POD_A: ${TRIDENT_LIVE_STATE_PATH_POD_A:-}
      TRIDENT_LIVE_STATE_PATH_POD_C: ${TRIDENT_LIVE_STATE_PATH_POD_C:-}
      TRIDENT_LIVE_ALLOW_UNKNOWN_POSITIONS: ${TRIDENT_LIVE_ALLOW_UNKNOWN_POSITIONS:-}
      TRIDENT_LIVE_ALLOW_OPEN_ORDERS: ${TRIDENT_LIVE_ALLOW_OPEN_ORDERS:-}
      TRIDENT_LIVE_SKIP_USER_WS_CHECK: ${TRIDENT_LIVE_SKIP_USER_WS_CHECK:-}
      TRIDENT_ENABLE_HIP4_OUTCOME: ${TRIDENT_ENABLE_HIP4_OUTCOME:-true}
    command:
      - python
      - -m
      - app.live.pod_c_live_runner
      - --mode
      - ${TRIDENT_MODE:-dry-run}
      - --config
      - ${TRIDENT_CONFIG_PATH:-config/trident.toml}
      - --journal-output
      - logs/pod_c_live.jsonl
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./data:/app/data
      - ./runtime:/app/runtime
    depends_on:
      trident-api:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  hip4-outcome-dry-run:
    build:
      context: .
      dockerfile: Dockerfile.trident
    container_name: trident-hip4-outcome-dry-run
    environment:
      HIP4_OUTCOME_MODE: ${HIP4_OUTCOME_MODE:-paper}
      HIP4_OUTCOME_ALLOW_TESTNET_ORDERS: ${HIP4_OUTCOME_ALLOW_TESTNET_ORDERS:-false}
      HIP4_OUTCOME_ACCOUNT_ADDRESS: ${HIP4_OUTCOME_ACCOUNT_ADDRESS:-}
      HIP4_OUTCOME_SECRET_KEY: ${HIP4_OUTCOME_SECRET_KEY:-}
      HIP4_OUTCOME_VAULT_ADDRESS: ${HIP4_OUTCOME_VAULT_ADDRESS:-}
      TRIDENT_ENABLE_HIP4_OUTCOME: ${TRIDENT_ENABLE_HIP4_OUTCOME:-true}
      HIP4_OUTCOME_ENABLE_EMBEDDED_OBSERVERS: ${HIP4_OUTCOME_ENABLE_EMBEDDED_OBSERVERS:-false}
    command:
      - python
      - -m
      - app.live.hip4_outcome_runner
      - --config
      - ${HIP4_OUTCOME_CONFIG:-config/hip4_outcome_mainnet_paper.toml}
      - --mode
      - ${HIP4_OUTCOME_MODE:-paper}
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./runtime:/app/runtime
    depends_on:
      trident-api:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["pod_b", "hip4"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  hip4-outcome-mainnet-observer:
    build:
      context: .
      dockerfile: Dockerfile.trident
    container_name: trident-hip4-outcome-mainnet-observer
    environment:
      HIP4_OUTCOME_MODE: observer
      HIP4_OUTCOME_ALLOW_TESTNET_ORDERS: "false"
      HIP4_OUTCOME_WRITE_POD_B_ALIAS_STATUS: "false"
      TRIDENT_ENABLE_HIP4_MAINNET_OBSERVER: ${TRIDENT_ENABLE_HIP4_MAINNET_OBSERVER:-true}
    command:
      - python
      - -m
      - app.live.hip4_outcome_runner
      - --config
      - ${HIP4_OUTCOME_MAINNET_CONFIG:-config/hip4_outcome_mainnet_observer.toml}
      - --mode
      - observer
    volumes:
      - ./config:/app/config:ro
      - ./logs:/app/logs
      - ./runtime:/app/runtime
    depends_on:
      trident-api:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["hip4_mainnet_observer"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  tradfi-funding-collector:
    build:
      context: .
      dockerfile: Dockerfile.trident
    container_name: trident-tradfi-funding-collector
    command:
      - python
      - -m
      - app.live.tradfi_funding_collector
      - --config
      - ${TRIDENT_CONFIG_PATH:-config/trident.toml}
      - --output
      - data/funding_history/pod_c_tradfi.jsonl
      - --poll-seconds
      - "60"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./runtime:/app/runtime
      - ./logs:/app/logs
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  funding-collector:
    build:
      context: .
      dockerfile: Dockerfile.trident
    container_name: trident-funding-collector
    command:
      - python
      - -m
      - app.live.funding_collector
      - --config
      - ${TRIDENT_CONFIG_PATH:-config/trident.toml}
      - --output
      - data/funding_history/current.jsonl
      - --poll-seconds
      - "300"
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data
      - ./runtime:/app/runtime
      - ./logs:/app/logs
    restart: unless-stopped
    profiles: ["funding"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
